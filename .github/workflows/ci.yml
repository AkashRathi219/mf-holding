name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (enforced paths)
        run: ruff check tests scripts webapp/log.py
      - name: Tracker rule self-test (F2)
        run: python scripts/tracker_status.py --selftest
      - name: Tracker ledger health
        run: python scripts/tracker_status.py --ci --skip-verify
      - name: Test suite
        run: pytest -q
