[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Deliberately lenient while the legacy codebase (webapp/db.py 3k lines,
# main.py CLI) is migrated; enforced paths grow per workstream via CI.
select = ["E4", "E7", "E9", "F"]
