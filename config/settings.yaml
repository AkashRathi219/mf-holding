fetch:
  delay_between_requests: 2.0
  max_retries: 3
  timeout: 60
  verify_ssl: false

parser:
  primary_engine: pdfplumber
  fallback_engine: pymupdf
  # Some AMCs (ICICI digital factsheets) render text as vector outlines with no
  # text layer; enable OCR so those PDFs still yield holdings data.
  ocr_enabled: true
  ocr_dpi: 200
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  # Agent-network parsing: split PDFs with PyMuPDF and read sections with
  # pdfplumber in a process pool (0 = auto = min(cpu_count, 8)).
  workers: 0
  chunk_pages: 6

# AI-assisted extraction for outline-rendered / scanned factsheets (optional).
# Requires the API key in an env var (never stored here). Results are cached
# downstream via the sha256 parse cache, so each source revision is billed once.
ai:
  enabled: false                       # or set AI_EXTRACT=1 in the environment
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-2.0-flash-001   # any vision-capable OpenRouter model
  mode: image                          # image (page renders) | text (OCR text)
  max_pages: 4                         # per-document page cap
  dpi: 150                             # render DPI sent to the model
  trigger_rows: 12                     # heuristic OCR below this -> try AI

scheduler:
  enabled: true
  day_of_month: 1
  hour: 6
  minute: 0
  timezone: Asia/Kolkata
  retry_days: 5
  # Daily NAV refresh: append the latest AMFI NAV points to data/nav_history/*
  # so the webapp's NAV charts stay current. Runs TWICE a day, 12h apart,
  # so the freshest possible NAV is always <12h old.
  # [NAV-FRESH] Evening run at 23:30 IST: AMFI publishes day-T NAVs ~23:00,
  # so the old 20:30 run always missed day T and it only landed next morning.
  nav_refresh:
    enabled: true
    hour: 23
    minute: 30
    hour2: 8              # second run of the day (08:30 IST)
    minute2: 30
    days: 10
  # Daily nav_history stub pre-heal [NAV-STUB]: upgrade thin (<30 pt)
  # cold-start files from R2/mirror before the first visitor pays for it.
  # Runs just after the morning NAV refresh; bounded per run.
  nav_preheal:
    enabled: true
    hour: 8
    minute: 35
  # Daily stock refresh: update closing prices + corporate actions + NSE
  # financial-report announcements for resolved equity stocks.
  stock_refresh:
    enabled: true
    hour: 21
    minute: 0
  # Daily bond/debt-market refresh: NSE bulk files (corporate-bond master, WDM
  # securities list, CBM trades) + rebuilt bond catalog with computed YTM.
  bond_refresh:
    enabled: true
    hour: 21
    minute: 30
  # Monthly AMFI/mfdata portfolio-disclosure fetch (tier-1 holdings source).
  # Runs days 8-12 (disclosures publish ~day 10); retries daily until done.
  amfi_refresh:
    enabled: true
    hour: 7
    minute: 15

paths:
  pdfs_dir: data/raw/pdfs
  parsed_dir: data/parsed/amc_websites
  logs_dir: archive/logs
  config_dir: config
  universe_dir: data/universe
  nifty_dir: data/nifty
  reference_dir: data/reference

logging:
  level: INFO

# Third-party captcha solving (used by adapters for captcha-protected sites
# like Kotak). INACTIVE: no key configured. The key NEVER lives in this file —
# set the CAPSOLVER_API_KEY environment variable to activate (see
# docs/DEPLOY_RAILWAY.md, "Activating CapSolver"). Get a key from
# https://dashboard.capsolver.com or https://2captcha.com
captcha:
  service: capsolver
  api_key: ""
  api_key_env: CAPSOLVER_API_KEY   # [S5] env-var indirection; empty = disabled
  timeout: 180
